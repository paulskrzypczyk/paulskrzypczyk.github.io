# -----------------------------------------------------------------------------
# Group page data  (rendered by _pages/group.md)
#
# Each section has a heading and a list of members. Sections with no members
# are not shown. Within a section, current members (current: true) are listed
# first, then former members in the order written here (newest first works best).
#
# Fields per member (only `name` is required):
#   name:      Full name
#   url:       personal website (makes the name a link)
#   years:     e.g. "2021 – 2025" or "2023 –"
#   current:   true for current members
#   thesis:    PhD thesis / project title
#   thesis_url: link to the thesis (makes the title a link)
#   co:        co-supervisor(s)
#   now:       where they went next / current position
#   now_url:   link for the current position (e.g. staff page)
#   note:      anything else (fellowships, etc.)
# -----------------------------------------------------------------------------

